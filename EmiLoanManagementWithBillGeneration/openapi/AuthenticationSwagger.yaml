openapi: 3.0.1

info:
  title: EMI Loan Management API
  version: 1.0.0
  description: >
    API documentation for EMI Loan Billing system.

servers:
  - url: http://localhost:8080/emi-bill-app

paths:

  /register:
    post:
      summary: Register a new user
      description: Creates a new user account using JSON request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid JSON request body
        '500':
          description: Internal server error


components:
  schemas:

    User:
      type: object
      description: User registration payload.
      properties:
        id:
          type: integer
          format: int64
          example: 1
          description: User ID (generated by server)

        username:
          type: string
          example: "anish_dev"
          description: Unique username for login

        password:
          type: string
          example: "Test@1234"
          description: >
            Must contain at least 8 characters including:
             1 uppercase  
             1 lowercase  
             1 digit  
             1 special character
          pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d)(?=.*[@#\\$%\\^&\\+=!]).{8,}$"

      required:
        - username
        - password
