version: "1.0"
domain: "LOAN"
entity: "EMI_CALCULATION"

inputs:
  - field: PRINCIPAL
    type: double
    required: true

  - field: ANNUAL_INTEREST_RATE
    type: double
    required: true

  - field: TENURE_MONTHS
    type: int
    required: true

  - field: CURRENT_MONTH
    type: int
    required: true

  - field: REMAINING_PRINCIPAL
    type: double
    required: true

  - field: TOTAL_INTEREST
    type: double

  - field: TOTAL_PAID
    type: double

rules:
  - name: Calculate Monthly Rate
    priority: 1
    type: var
    expression: >
      ANNUAL_INTEREST_RATE / 12.0 / 100.0
    returnType: double
    returns:
      MONTHLY_RATE: "$expressionResult"

  - name: Calculate Fixed EMI
    priority: 2
    type: var
    expression: >
      pow(1 + MONTHLY_RATE, TENURE_MONTHS) == 1
        ? 0.0
        : (
            (PRINCIPAL * MONTHLY_RATE * pow(1 + MONTHLY_RATE, TENURE_MONTHS))
            / (pow(1 + MONTHLY_RATE, TENURE_MONTHS) - 1)
          )
    returnType: double
    returns:
      FIXED_EMI: "$expressionResult"

  - name: Calculate Monthly Interest
    priority: 3
    type: var
    expression: >
      REMAINING_PRINCIPAL * MONTHLY_RATE
    returnType: double
    returns:
      INTEREST: "$expressionResult"

  - name: Calculate EMI Payable
    priority: 4
    type: var
    expression: >
      CURRENT_MONTH == TENURE_MONTHS
        ? REMAINING_PRINCIPAL + INTEREST
        : FIXED_EMI
    returnType: double
    returns:
      EMI_PAYABLE: "$expressionResult"

  - name: Principal Component
    priority: 5
    type: var
    expression: >
      EMI_PAYABLE - INTEREST
    returnType: double
    returns:
      PRINCIPAL_COMPONENT: "$expressionResult"

  - name: Calculate New Remaining Principal
    priority: 6
    type: var
    expression: >
      max(0.0, REMAINING_PRINCIPAL - PRINCIPAL_COMPONENT)
    returnType: double
    returns:
      NEW_REMAINING_PRINCIPAL: "$expressionResult"

  - name: Accumulate Total Interest
    priority: 7
    type: var
    expression: >
      TOTAL_INTEREST == 0.0
        ? INTEREST
        : TOTAL_INTEREST + INTEREST
    returnType: double
    returns:
      TOTAL_INTEREST: "$expressionResult"

  - name: Calculate Total Paid
    priority: 8
    type: var
    expression: >
      TOTAL_PAID == 0.0
        ? EMI_PAYABLE
        : TOTAL_PAID + EMI_PAYABLE
    returnType: double
    returns:
      TOTAL_PAID: "$expressionResult"

  - name: Final EMI Output
    priority: 100
    type: when
    when:
      expression: "true"
    then:
      endRule: true
      returns:
        MONTHLY_RATE: "$MONTHLY_RATE"
        FIXED_EMI: "$FIXED_EMI"
        INTEREST: "$INTEREST"
        EMI_PAYABLE: "$EMI_PAYABLE"
        PRINCIPAL_COMPONENT: "$PRINCIPAL_COMPONENT"
        NEW_REMAINING_PRINCIPAL: "$NEW_REMAINING_PRINCIPAL"
        TOTAL_INTEREST: "$TOTAL_INTEREST"
        TOTAL_PAID: "$TOTAL_PAID"
